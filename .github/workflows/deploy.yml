name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 跳过（尚未配置服务器）
        if: ${{ secrets.SSH_HOST == '' }}
        run: echo "未配置 SSH_HOST（GitHub Secrets），跳过部署。购买服务器后按 deploy/README.md 添加 SSH_HOST / SSH_USER / SSH_KEY 即可。"

      - name: 通过 SSH 在服务器执行部署脚本
        if: ${{ secrets.SSH_HOST != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: bash /opt/myblog/deploy/deploy.sh
